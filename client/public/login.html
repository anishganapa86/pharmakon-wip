<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pharmakon – Log in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#ecf6f4">
    <meta name="pharmakon-api-base" content="auto">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@500&display=swap">
    <style>
        :root {
            --text: #4b5968;
            --text-h: #0b1b2b;
            --border: #d9e4e3;
            --accent: #0b7a6b;
            --accent-hover: #096558;
            --accent-bg: rgba(11, 122, 107, 0.09);
            --error: #d92d20;
            --sans: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;

            font: 16px/150% var(--sans);
            color: var(--text);
            color-scheme: light;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ecf6f4 url("/lattice.svg") 0 0 / 448px 900px repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: url("/decor-molecule.svg") no-repeat right -90px top calc(58px + env(safe-area-inset-top, 0px)) / 330px 215px;
    }

        main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .brand {
            text-align: center;
        }

        .brand h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.8px;
            line-height: 1.1;
            color: var(--text-h);
        }

        .brand p {
            margin: 6px 0 0;
            font-size: 15px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            padding: 28px 26px 24px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow:
                0 1px 2px rgba(11, 27, 43, 0.05),
                0 12px 30px rgba(11, 27, 43, 0.1);
        }

        .login-box h2 {
            margin: 0 0 18px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.1px;
            color: var(--text-h);
        }

        .field {
            margin: 0 0 14px;
        }

        .login-box input {
            display: block;
            width: 100%;
            height: 42px;
            padding: 0 12px;
            margin: 0;
            box-sizing: border-box;
            font: inherit;
            font-size: 16px;
            color: var(--text-h);
            background: #ffffff;
            border: 1px solid #cbd5df;
            border-radius: 8px;
        }

        .login-box input:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .login-box button {
            width: 100%;
            height: 42px;
            margin-top: 4px;
            padding: 0 20px;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .login-box button:hover:not(:disabled) {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .login-box button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .login-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin: 14px 0 0;
            min-height: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--error);
        }

        .message.ok {
            color: var(--accent);
        }

        .disclaimer {
            max-width: 440px;
            margin: 0;
            font-size: 13px;
            text-align: center;
        }

        .login-box input[aria-invalid="true"] {
            border-color: var(--error);
        }

        .field-error {
            margin: 4px 0 0;
            min-height: 18px;
            font-size: 13px;
            line-height: 18px;
            font-weight: 500;
            color: var(--error);
        }

        .switch {
            margin: 18px 0 0;
            font-size: 14px;
            text-align: center;
        }

        .switch a {
            color: var(--accent);
            font-weight: 600;
        }

        .switch a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 2px;
        }

        :root {
            --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
            --color-ink: #0b1b2b;
            --color-text: #4b5968;
            --color-accent: #0b7a6b;
            --color-accent-strong: #096558;
            --color-hairline: #e3e9e8;
            --color-control-border: #cbd5df;
            --color-danger: #d92d20;
            --radius-10: 10px;
            --radius-16: 16px;
            --space-5: 20px;
            --tap: 44px;
            --ease: 180ms ease;
        }

        main {
            padding: calc(24px + env(safe-area-inset-top, 0px)) var(--space-5) calc(24px + env(safe-area-inset-bottom, 0px));
        }

        .brand h1 {
            font-size: 44px;
            letter-spacing: -0.4px;
        }

        .brand p {
            font-size: 15px;
        }

        .login-box {
            max-width: 350px;
            padding: var(--space-5);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-16);
            box-shadow: none;
        }

        .login-box h2 {
            margin: 0 0 8px;
            font-family: var(--serif);
            font-size: 28px;
            font-weight: 500;
            line-height: 1.15;
            letter-spacing: -0.2px;
            text-wrap: balance;
        }

        .login-box input {
            height: 42px;
            font-size: 15px;
            border-radius: var(--radius-10);
            transition: border-color var(--ease);
        }

        .login-box input:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 1px;
            box-shadow: none;
        }

        .login-box button {
            height: var(--tap);
            font-size: 15px;
            border-radius: var(--radius-10);
        }

        .login-box button:active:not(:disabled) {
            background: var(--color-accent-strong);
            transform: scale(0.99);
        }

        .switch a {
            text-decoration: none;
        }

        .disclaimer {
            max-width: 350px;
            font-size: 13px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <h1>Pharmakon</h1>
            <p>Track what you take and see how it adds up.</p>
        </div>

        <form class="login-box" id="login-form" novalidate>
            <h2>Log in</h2>
            <div class="field">
                <input type="email" id="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
            </div>
            <div class="field">
                <input type="password" id="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
            </div>
            <button type="submit" id="submit">Log in</button>
            <p class="message" id="message" role="status" aria-live="polite"></p>
            <p class="switch">New here? <a href="/signup.html">Create an account</a></p>
        </form>

        <p class="disclaimer">Educational and demonstrative use only. Not a medical device.</p>
    </main>

    <script>
        const configuredBase = document
            .querySelector('meta[name="pharmakon-api-base"]')
            .content;
        const onLocalhost = ["localhost", "127.0.0.1"].indexOf(window.location.hostname) !== -1;
        const apiBase = (configuredBase === "auto"
            ? (onLocalhost ? "http://localhost:8000" : "/api")
            : configuredBase).replace(/\/+$/, "");
        const APP_URL = "/";

        function serverMessage(response, body) {
            if (body && body.error && body.error.message) {
                const wait = Number(response.headers.get("Retry-After"));
                if (response.status === 429 && wait > 0) {
                    return body.error.message + " Try again in " + wait + " seconds.";
                }
                return body.error.message;
            }
            return "Something went wrong. Please try again.";
        }

        async function postJson(path, payload) {
            const response = await fetch(apiBase + path, {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            let body = null;
            try {
                body = await response.json();
            } catch (e) {
                body = null;
            }
            return { response: response, body: body };
        }

        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const button = document.getElementById("submit");

        function showMessage(text, ok) {
            message.classList.toggle("ok", ok);
            message.textContent = text;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showMessage("Enter your email and password.", false);
                return;
            }

            button.disabled = true;
            button.textContent = "Logging in…";
            showMessage("", false);

            try {
                const result = await postJson("/auth/login", { email: email, password: password });
                if (result.response.ok) {
                    showMessage("Login successful! Opening Pharmakon…", true);
                    window.location.replace(APP_URL);
                    return;
                }
                showMessage(serverMessage(result.response, result.body), false);
            } catch (e) {
                showMessage("Couldn't reach the server. Check that it is running, then try again.", false);
            }
            button.disabled = false;
            button.textContent = "Log in";
        });
    </script>
</body>
</html>
