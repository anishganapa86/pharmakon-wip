<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pharmakon – Create account</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#ecf6f4">
    <meta name="pharmakon-api-base" content="auto">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@500&display=swap">
    <style>
        :root {
            --text: #4b5968;
            --text-h: #0b1b2b;
            --border: #d9e4e3;
            --accent: #0b7a6b;
            --accent-hover: #096558;
            --accent-bg: rgba(11, 122, 107, 0.09);
            --error: #d92d20;
            --sans: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;

            font: 16px/150% var(--sans);
            color: var(--text);
            color-scheme: light;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ecf6f4 url("/lattice.svg") 0 0 / 448px 900px repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: url("/decor-molecule.svg") no-repeat right -90px top calc(58px + env(safe-area-inset-top, 0px)) / 330px 215px;
    }

        main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .brand {
            text-align: center;
        }

        .brand h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.8px;
            line-height: 1.1;
            color: var(--text-h);
        }

        .brand p {
            margin: 6px 0 0;
            font-size: 15px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            padding: 28px 26px 24px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow:
                0 1px 2px rgba(11, 27, 43, 0.05),
                0 12px 30px rgba(11, 27, 43, 0.1);
        }

        .login-box h2 {
            margin: 0 0 18px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.1px;
            color: var(--text-h);
        }

        .field {
            margin: 0 0 14px;
        }

        .login-box input {
            display: block;
            width: 100%;
            height: 42px;
            padding: 0 12px;
            margin: 0;
            box-sizing: border-box;
            font: inherit;
            font-size: 16px;
            color: var(--text-h);
            background: #ffffff;
            border: 1px solid #cbd5df;
            border-radius: 8px;
        }

        .login-box input:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .login-box button {
            width: 100%;
            height: 42px;
            margin-top: 4px;
            padding: 0 20px;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .login-box button:hover:not(:disabled) {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .login-box button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .login-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin: 14px 0 0;
            min-height: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--error);
        }

        .message.ok {
            color: var(--accent);
        }

        .disclaimer {
            max-width: 440px;
            margin: 0;
            font-size: 13px;
            text-align: center;
        }

        .login-box input[aria-invalid="true"] {
            border-color: var(--error);
        }

        .field-error {
            margin: 4px 0 0;
            min-height: 18px;
            font-size: 13px;
            line-height: 18px;
            font-weight: 500;
            color: var(--error);
        }

        .switch {
            margin: 18px 0 0;
            font-size: 14px;
            text-align: center;
        }

        .switch a {
            color: var(--accent);
            font-weight: 600;
        }

        .switch a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 2px;
        }

        :root {
            --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
            --color-ink: #0b1b2b;
            --color-text: #4b5968;
            --color-accent: #0b7a6b;
            --color-accent-strong: #096558;
            --color-hairline: #e3e9e8;
            --color-control-border: #cbd5df;
            --color-danger: #d92d20;
            --radius-10: 10px;
            --radius-16: 16px;
            --space-5: 20px;
            --tap: 44px;
            --ease: 180ms ease;
        }

        main {
            padding: calc(24px + env(safe-area-inset-top, 0px)) var(--space-5) calc(24px + env(safe-area-inset-bottom, 0px));
        }

        .brand h1 {
            font-size: 44px;
            letter-spacing: -0.4px;
        }

        .brand p {
            font-size: 15px;
        }

        .login-box {
            max-width: 350px;
            padding: var(--space-5);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-16);
            box-shadow: none;
        }

        .login-box h2 {
            margin: 0 0 8px;
            font-family: var(--serif);
            font-size: 28px;
            font-weight: 500;
            line-height: 1.15;
            letter-spacing: -0.2px;
            text-wrap: balance;
        }

        .login-box input {
            height: 42px;
            font-size: 16px;
            border-radius: var(--radius-10);
            transition: border-color var(--ease);
        }

        .login-box input:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 1px;
            box-shadow: none;
        }

        .login-box button {
            height: var(--tap);
            font-size: 16px;
            border-radius: var(--radius-10);
        }

        .login-box button:active:not(:disabled) {
            background: var(--color-accent-strong);
            transform: scale(0.99);
        }

        .switch a {
            text-decoration: none;
        }

        .disclaimer {
            max-width: 350px;
            font-size: 13px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }

        .login-box label {
            display: block;
            margin: 0 0 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-ink);
        }

        .login-box .lede {
            margin: 0 0 var(--space-5);
            font-size: 15px;
        }

        .field {
            margin: 0 0 20px;
        }

        .hint-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 8px 0 0;
            font-size: 14px;
            color: #5f6e7c;
        }

        .hint-row .hint-icon {
            flex: none;
            opacity: 0.45;
        }

        .hint-row.met {
            color: var(--color-accent);
        }

        .hint-row.met .hint-icon {
            opacity: 1;
        }

        .field-error {
            min-height: 0;
            margin: 6px 0 0;
        }

        .field-error:empty {
            display: none;
        }

        .message:empty {
            display: none;
        }

        .login-box button {
            margin-top: 12px;
        }

        .switch {
            margin: 20px 0 0;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <h1>Pharmakon</h1>
            <p>Track what you take and see how it adds up.</p>
        </div>

        <form class="login-box" id="signup-form" novalidate>
            <h2>Create your account</h2>
            <p class="lede">It takes less than a minute.</p>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" aria-describedby="email-error" autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
                <p class="field-error" id="email-error" role="alert"></p>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" aria-describedby="password-error" autocomplete="new-password">
                <p class="field-error" id="password-error" role="alert"></p>
                <p class="hint-row" id="password-hint"><svg class="hint-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5L5.5 10.5L11.5 3.5"/></svg><span>At least 10 characters</span></p>
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" name="confirm" aria-describedby="confirm-error" autocomplete="new-password">
                <p class="field-error" id="confirm-error" role="alert"></p>
                <p class="hint-row" id="confirm-hint"><svg class="hint-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5L5.5 10.5L11.5 3.5"/></svg><span>Passwords match</span></p>
            </div>
            <button type="submit" id="submit">Create account</button>
            <p class="message" id="message" role="status" aria-live="polite"></p>
            <p class="switch">Already have an account? <a href="/login.html">Log in</a></p>
        </form>

        <p class="disclaimer">Educational and demonstrative use only. Not a medical device.</p>
    </main>

    <script>
        const configuredBase = document
            .querySelector('meta[name="pharmakon-api-base"]')
            .content;
        const onLocalhost = ["localhost", "127.0.0.1"].indexOf(window.location.hostname) !== -1;
        const apiBase = (configuredBase === "auto"
            ? (onLocalhost ? "http://localhost:8000" : "/api")
            : configuredBase).replace(/\/+$/, "");
        const APP_URL = "/";

        function serverMessage(response, body) {
            if (body && body.error && body.error.message) {
                const wait = Number(response.headers.get("Retry-After"));
                if (response.status === 429 && wait > 0) {
                    return body.error.message + " Try again in " + wait + " seconds.";
                }
                return body.error.message;
            }
            return "Something went wrong. Please try again.";
        }

        async function postJson(path, payload) {
            const response = await fetch(apiBase + path, {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            let body = null;
            try {
                body = await response.json();
            } catch (e) {
                body = null;
            }
            return { response: response, body: body };
        }

        const PASSWORD_MIN = 10;
        const PASSWORD_MAX = 128;
        const EMAIL_MAX = 254;
        const EMAIL_PATTERN = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

        const form = document.getElementById("signup-form");
        const message = document.getElementById("message");
        const button = document.getElementById("submit");
        const fields = {
            email: document.getElementById("email"),
            password: document.getElementById("password"),
            confirm: document.getElementById("confirm")
        };
        const errors = {
            email: document.getElementById("email-error"),
            password: document.getElementById("password-error"),
            confirm: document.getElementById("confirm-error")
        };

        function setFieldError(name, text) {
            errors[name].textContent = text;
            if (text) {
                fields[name].setAttribute("aria-invalid", "true");
            } else {
                fields[name].removeAttribute("aria-invalid");
            }
        }

        function checkEmail() {
            const email = fields.email.value.trim().toLowerCase();
            let text = "";
            if (!email) {
                text = "Enter your email address.";
            } else if (email.length > EMAIL_MAX || !EMAIL_PATTERN.test(email)) {
                text = "Enter a valid email address.";
            }
            setFieldError("email", text);
            return !text;
        }

        function checkPassword() {
            const length = fields.password.value.length;
            let text = "";
            if (length < PASSWORD_MIN) {
                text = "Use at least " + PASSWORD_MIN + " characters.";
            } else if (length > PASSWORD_MAX) {
                text = "Use at most " + PASSWORD_MAX + " characters.";
            }
            setFieldError("password", text);
            return !text;
        }

        function checkConfirm() {
            let text = "";
            if (!fields.confirm.value) {
                text = "Re-enter your password.";
            } else if (fields.confirm.value !== fields.password.value) {
                text = "Passwords do not match.";
            }
            setFieldError("confirm", text);
            return !text;
        }

        fields.email.addEventListener("blur", function () {
            if (fields.email.value) {
                checkEmail();
            }
        });
        fields.password.addEventListener("blur", function () {
            if (fields.password.value) {
                checkPassword();
            }
            if (fields.confirm.value) {
                checkConfirm();
            }
        });
        fields.confirm.addEventListener("blur", function () {
            if (fields.confirm.value) {
                checkConfirm();
            }
        });
        fields.email.addEventListener("input", function () {
            if (errors.email.textContent) {
                checkEmail();
            }
        });
        fields.password.addEventListener("input", function () {
            if (errors.password.textContent) {
                checkPassword();
            }
            if (errors.confirm.textContent) {
                checkConfirm();
            }
        });
        fields.confirm.addEventListener("input", function () {
            if (errors.confirm.textContent) {
                checkConfirm();
            }
        });

        const passwordHint = document.getElementById("password-hint");
        const confirmHint = document.getElementById("confirm-hint");

        function updateHints() {
            const length = fields.password.value.length;
            passwordHint.classList.toggle("met", length >= PASSWORD_MIN && length <= PASSWORD_MAX);
            confirmHint.classList.toggle(
                "met",
                fields.confirm.value !== "" && fields.confirm.value === fields.password.value
            );
        }

        fields.password.addEventListener("input", updateHints);
        fields.confirm.addEventListener("input", updateHints);

        function showMessage(text) {
            message.textContent = text;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            showMessage("");

            const emailOk = checkEmail();
            const passwordOk = checkPassword();
            const confirmOk = checkConfirm();
            if (!(emailOk && passwordOk && confirmOk)) {
                const first = [fields.email, fields.password, fields.confirm].find(function (field) {
                    return field.getAttribute("aria-invalid") === "true";
                });
                if (first) {
                    first.focus();
                }
                return;
            }

            button.disabled = true;
            button.textContent = "Creating account…";

            try {
                const result = await postJson("/auth/signup", {
                    email: fields.email.value.trim(),
                    password: fields.password.value
                });
                if (result.response.ok) {
                    window.location.replace(APP_URL);
                    return;
                }
                const text = serverMessage(result.response, result.body);
                if (result.response.status === 409) {
                    setFieldError("email", text);
                    fields.email.focus();
                } else {
                    showMessage(text);
                }
            } catch (e) {
                showMessage("Couldn't reach the server. Check that it is running, then try again.");
            }
            button.disabled = false;
            button.textContent = "Create account";
        });
    </script>
</body>
</html>
